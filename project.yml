name: HeadRecorder
options:
  bundleIdPrefix: com.yuriivoevodin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  HeadRecorder:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: HeadRecorder
        type: syncedFolder
        excludes:
          - "HeadRecorder.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuriivoevodin.HeadRecorder
        CODE_SIGN_ENTITLEMENTS: HeadRecorder/HeadRecorder.entitlements
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_LANGUAGE: en
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        STRING_CATALOG_GENERATE_SYMBOLS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M2BF9ZE9NW
        INFOPLIST_KEY_CFBundleDisplayName: "Head Recorder"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSCameraUsageDescription: "This app needs camera access to overlay your webcam video on the screen recording."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "This app needs microphone access to record audio along with the video."
        INFOPLIST_KEY_NSHighResolutionCapable: true
